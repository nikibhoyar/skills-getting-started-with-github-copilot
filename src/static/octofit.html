<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octofit</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Octofit</h1>
      <h2>Fitness app sample page</h2>
    </header>

    <main>
      <section>
        <h3>Octofit Status</h3>
        <p id="octofit-status">Loading status...</p>
      </section>

      <section>
        <h3>Workouts</h3>
        <div id="octofit-workouts">Loading workouts...</div>
        <form id="workout-form">
          <h4>Add a workout</h4>
          <div class="form-group">
            <label for="workout-name">Name</label>
            <input id="workout-name" type="text" required />
          </div>
          <div class="form-group">
            <label for="workout-duration">Duration (minutes)</label>
            <input id="workout-duration" type="number" required min="1" />
          </div>
          <button type="submit">Create workout</button>
          <p id="workout-message" class="hidden"></p>
        </form>
      </section>

      <section>
        <h3>Users</h3>
        <div id="octofit-users">Loading users...</div>
        <form id="user-form">
          <h4>Add a user</h4>
          <div class="form-group">
            <label for="user-name">Name</label>
            <input id="user-name" type="text" required />
          </div>
          <div class="form-group">
            <label for="user-email">Email</label>
            <input id="user-email" type="email" required />
          </div>
          <button type="submit">Create user</button>
          <p id="user-message" class="hidden"></p>
        </form>
      </section>

      <section>
        <h3>API Docs</h3>
        <p>
          Open the API documentation at <a href="/docs">/docs</a> to explore the
          Octofit endpoints along with the existing activities API.
        </p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Octofit Sample App</p>
    </footer>
    <script src="octofit.js"></script>
  </body>
</html>
